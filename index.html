<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>🏕️ Семейный Лагерь 2025</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{--g:#1D9E75;--gl:#E1F5EE;--gm:#5DCAA5;--gd:#0F6E56;--am:#BA7517;--al:#FAEEDA;--s:#F7F3EC;--s2:#EDE8DF;--t:#1A1A2E;--t2:#5A5A6E;--t3:#9090A0;--b:#E2DDD5;--w:#FFFFFF;--r:14px;--rs:9px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:var(--s);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;color:var(--t);overflow:hidden}
.app{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--s)}
.hidden{display:none!important}
.screen{flex:1;display:flex;flex-direction:column;width:100%;overflow:hidden;min-height:0}
.hdr{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--w);border-bottom:1px solid var(--b);flex-shrink:0;position:sticky;top:0;z-index:50}
.hdr-t{font-size:17px;font-weight:700;color:var(--t)}
.hdr-s{font-size:12px;color:var(--t3);margin-top:1px}
.hdr-btn{padding:6px 12px;font-size:12px;border:1px solid var(--b);border-radius:99px;background:var(--s);color:var(--t2);cursor:pointer;display:flex;align-items:center;gap:4px}
.cstrip{display:flex;gap:8px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:var(--s);position:sticky;top:57px;z-index:40}
.cstrip::-webkit-scrollbar{display:none}
.cchip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:var(--r);border:1.5px solid var(--b);background:var(--w);cursor:pointer;min-width:68px;flex-shrink:0;transition:all .15s}
.cchip.on{border-color:var(--g);background:var(--gl)}
.cav{font-size:26px}.cn{font-size:11px;font-weight:600;color:var(--t)}.ca{font-size:10px;color:var(--t3)}
.sc{flex:1;overflow-y:auto;padding:12px 14px 90px;-webkit-overflow-scrolling:touch;min-height:0}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--w);border-top:1px solid var(--b);display:flex;padding:8px 4px 20px;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:none;background:transparent;cursor:pointer;color:var(--t3);font-size:10px;font-weight:500}
.nb i{font-size:22px;line-height:1}
.nb.on{color:var(--g)}
.card{background:var(--w);border-radius:var(--r);border:1px solid var(--b);padding:14px;margin-bottom:10px}
.ch{font-size:13px;font-weight:600;color:var(--t);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ch i{font-size:17px;color:var(--g)}
.wb{height:10px;background:var(--s2);border-radius:99px;overflow:hidden}
.wbf{height:100%;background:var(--g);border-radius:99px;transition:width .5s}
.wbl{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-bottom:4px}
.ep{font-size:26px;font-weight:700;color:var(--g);margin:4px 0}
.el{font-size:11px;color:var(--t3)}
.fact{border-radius:var(--rs);padding:10px 12px;margin-bottom:8px;border-left:3px solid}
.ff{background:#E1F5EE;border-color:var(--g)}.fp{background:#E6F1FB;border-color:#378ADD}.fn{background:#EAF3DE;border-color:#639922}
.ftag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.ff .ftag{color:var(--gd)}.fp .ftag{color:#185FA5}.fn .ftag{color:#3B6D11}
.ft{font-size:13px;color:var(--t);line-height:1.55}
.mrow{display:flex;gap:6px}
.mb{flex:1;border:1.5px solid var(--b);border-radius:var(--rs);background:var(--w);padding:8px 4px;cursor:pointer;text-align:center}
.mb.on{border-color:var(--g);background:var(--gl)}
.me{font-size:22px;display:block}.ml{font-size:9px;color:var(--t3);display:block;margin-top:2px}
.oq{font-size:14px;color:var(--t);line-height:1.55;margin-bottom:10px;font-style:italic}
.oo{display:flex;flex-direction:column;gap:6px}
.ob{padding:9px 14px;border:1.5px solid var(--b);border-radius:var(--rs);background:var(--w);font-size:13px;color:var(--t);cursor:pointer;text-align:left}
.qz-opt{display:block;width:100%;padding:9px 14px;border:1.5px solid var(--b);border-radius:var(--rs);background:var(--w);font-size:13px;color:var(--t);cursor:pointer;text-align:left;margin-bottom:6px;transition:all .2s}
.qz-opt:not([disabled]):hover{border-color:var(--p);background:var(--s2)}
.qz-opt[disabled]{cursor:default}
.ob.on{border-color:var(--g);background:var(--gl);color:var(--gd);font-weight:500}
.qcard{background:var(--w);border:1px solid var(--b);border-radius:var(--r);padding:14px;margin-bottom:10px}
.qtr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.qn{font-size:15px;font-weight:600;color:var(--t)}
.qp{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--al);color:var(--am);white-space:nowrap}
.qd{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:10px}
.slist{list-style:none;counter-reset:s;margin-bottom:10px}
.slist li{font-size:12px;color:var(--t);padding:4px 0 4px 22px;position:relative;line-height:1.4;counter-increment:s}
.slist li::before{content:counter(s);position:absolute;left:0;top:5px;width:15px;height:15px;background:var(--s2);border-radius:50%;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.crit{font-size:11px;color:var(--t3);margin-bottom:10px;padding:6px 10px;background:var(--s);border-radius:var(--rs)}
.btn{width:100%;padding:12px;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.97)}
.bg{background:var(--g);color:white}.bg:hover{background:var(--gd)}
.bd{background:var(--gl);color:var(--gd);border:1.5px solid var(--gm)}.bd:disabled{opacity:1;cursor:default}
.bo{background:var(--w);color:var(--t);border:1.5px solid var(--b)}
.slbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin:14px 0 6px}
.ph{text-align:center;padding:20px 0 14px}
.pab{font-size:64px;display:block;margin-bottom:8px}
.pname{font-size:22px;font-weight:700;color:var(--t)}
.plv{font-size:13px;color:var(--g);margin-top:2px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sc2{background:var(--s2);border-radius:var(--rs);padding:10px;text-align:center}
.sn{font-size:22px;font-weight:700;color:var(--t)}.sl2{font-size:10px;color:var(--t3);margin-top:2px}
.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ac{border:1.5px solid var(--b);border-radius:var(--rs);padding:8px 4px;text-align:center;background:var(--w)}
.ai{font-size:20px;display:block;margin-bottom:3px}.an{font-size:9px;color:var(--t3);line-height:1.3}
.de{border-top:1px solid var(--b);padding:10px 0}
.dd{font-size:11px;color:var(--t3);margin-bottom:3px}.dt{font-size:13px;color:var(--t);line-height:1.5}
.dq{font-size:14px;color:var(--t);line-height:1.6;font-style:italic;padding:8px 12px;border-left:3px solid var(--g);background:var(--gl);border-radius:0 var(--rs) var(--rs) 0}
.lvrow{display:flex;align-items:center;gap:8px;margin:10px 0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--t);color:white;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pov{position:fixed;inset:0;background:rgba(26,26,46,.75);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.psh{background:var(--w);border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:430px}
.ptit{font-size:18px;font-weight:700;color:var(--t);margin-bottom:4px}
.psub{font-size:13px;color:var(--t3);margin-bottom:20px}
.pdots{display:flex;gap:14px;justify-content:center;margin-bottom:24px}
.pd{width:14px;height:14px;border-radius:50%;background:var(--s2)}.pd.on{background:var(--g)}
.ppad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pk{padding:16px;border:1.5px solid var(--b);border-radius:var(--r);background:var(--w);font-size:20px;font-weight:600;cursor:pointer;color:var(--t);text-align:center}
.pk:active{background:var(--s2);transform:scale(.95)}
.pk.del{font-size:16px;color:var(--t2)}.pk.empty{background:transparent;border-color:transparent;pointer-events:none}
.perr{font-size:13px;color:#E24B4A;text-align:center;margin-top:8px}
.spin{width:32px;height:32px;border:3px solid var(--gl);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loader{display:flex;flex-direction:column;align-items:center;padding:40px 20px;gap:12px}
.loader-txt{font-size:14px;color:var(--t3);text-align:center;line-height:1.5}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block;margin-right:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.review-img{width:100%;max-height:200px;object-fit:cover;border-radius:var(--rs);margin-bottom:10px}
.badge-new{background:var(--g);color:white;font-size:10px;padding:1px 7px;border-radius:99px;margin-left:6px}
</style>
</head>
<body>
<div class="app">
<div id="tst" class="toast"></div>

<!-- PARENT SCREEN -->
<div id="sp" class="screen hidden" style="display:flex;flex-direction:column;height:100%">
  <div class="hdr" style="flex-shrink:0">
    <div><div class="hdr-t">Панель папы</div><div class="hdr-s">Талгат · реальное время</div></div>
    <button class="hdr-btn" id="btn-back"><i class="ti ti-arrow-left" style="font-size:14px"></i> К детям</button>
  </div>
  <div id="pc" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 40px;min-height:0"></div>
</div>

<!-- PIN -->
<div id="pov" class="pov hidden">
  <div class="psh">
    <div class="ptit">Панель папы</div>
    <div class="psub">Введите PIN-код</div>
    <div class="pdots"><div class="pd" id="d0"></div><div class="pd" id="d1"></div><div class="pd" id="d2"></div><div class="pd" id="d3"></div></div>
    <div class="ppad" id="pin-pad"></div>
    <div class="perr hidden" id="perr">Неверный PIN</div>
    <button class="btn bo" style="margin-top:16px" id="pin-cancel">Отмена</button>
  </div>
</div>

<!-- CHILD SCREEN -->
<div id="sc" class="screen">
  <div class="hdr">
    <div><div class="hdr-t">🏕️ Семейный лагерь</div><div class="hdr-s" id="hdate"></div></div>
    <button class="hdr-btn" id="btn-parent"><i class="ti ti-shield-lock" style="font-size:14px"></i> Папе</button>
  </div>
  <div class="cstrip" id="cstrip"></div>
  <div class="sc" id="cc"></div>
  <nav class="bnav">
    <button class="nb on" id="nb0" data-tab="today"><i class="ti ti-sun"></i>Сегодня</button>
    <button class="nb" id="nb1" data-tab="quests"><i class="ti ti-sword"></i>Квест</button>
    <button class="nb" id="nb2" data-tab="project"><i class="ti ti-plant"></i>Проект</button>
    <button class="nb" id="nb3" data-tab="diary"><i class="ti ti-notebook"></i>Дневник</button>
    <button class="nb" id="nb4" data-tab="profile"><i class="ti ti-medal"></i>Профиль</button>
  </nav>
</div>
</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getFirestore,doc,setDoc,getDoc,onSnapshot,collection,query,orderBy,serverTimestamp,updateDoc,arrayUnion,deleteField,increment} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';


const FB={
  apiKey:"AIzaSyAsSf4P74g4pFo7AN1Gy9wgSbD4S9kbPuQ",
  authDomain:"family-camp-2025.firebaseapp.com",
  projectId:"family-camp-2025",
  storageBucket:"family-camp-2025.firebasestorage.app",
  messagingSenderId:"971649275154",
  appId:"1:971649275154:web:476c93a854d5f6c9f80fcb"
};
const app=initializeApp(FB);
const db=getFirestore(app);

// ── CONSTANTS ──
const PIN='1234'; // ← СМЕНИ НА СВОЙ
const CHILDREN=[
  {id:'bakhyt', name:'Бахытжан',age:8, av:'🐆',gr:'j',maxW:900, maxP:4000},
  {id:'zhasmin',name:'Жасмин',  age:9, av:'🦅',gr:'j',maxW:900, maxP:4000},
  {id:'alikhan',name:'Алихан',  age:10,av:'🦌',gr:'j',maxW:900, maxP:4000},
  {id:'aslan',  name:'Аслан',   age:15,av:'🐺',gr:'s',maxW:1600,maxP:8000}
];
const DAYS=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WEEK_THEMES=['Деньги и как они работают','Казахстан: природа и животные','Законы физики вокруг нас','Как устроен человек','Технологии и будущее','Казахстан: история и культура','Химия в еде и дома','Космос и Вселенная','Экология и климат','Психология и эмоции','Математика в жизни','Казахстан: экономика','Итоги лета'];
const LEVELS=[{n:'Новичок',m:0},{n:'Искатель',m:500},{n:'Исследователь',m:1500},{n:'Знаток',m:3000},{n:'Мастер',m:5000},{n:'Легенда',m:8000}];
const ACHS=[{ico:'🔥',n:'7 дней подряд'},{ico:'🧪',n:'Учёный'},{ico:'💰',n:'Финансист'},{ico:'📸',n:'Фотограф'},{ico:'🤝',n:'Командный'},{ico:'📚',n:'Книжный червь'},{ico:'🌟',n:'Чемпион'},{ico:'🇰🇿',n:'Знаток РК'}];
const FALLBACK={
  j:{facts:[{type:'fin',tag:'Финансы 🇰🇿',text:'Тенге появился в 1993 году — символ независимости Казахстана!'},{type:'phy',tag:'Физика',text:'Небо синее потому что синие лучи рассеиваются в воздухе сильнее всего!'},{type:'nat',tag:'Природа 🇰🇿',text:'Снежный барс — символ Казахстана — прыгает на 9 метров в длину!'}],opinion:{q:'Если бы у тебя было 10 000 тенге — что бы сделал?',opts:['Потратил сразу','Накопил','Отдал половину']},quest:{title:'Охотник за монетами',desc:'Найди дома все монеты тенге и посчитай сумму!',steps:['Обыщи карманы и ящики','Разложи по номиналам','Посчитай сумму','Запиши результат'],pts:100,crit:'Показал монеты и сумму'},dinner:'Что бы ты изобрёл чтобы помочь всем людям?'},
  s:{facts:[{type:'fin',tag:'Финансы',text:'Инфляция ~8% в год. Деньги под подушкой теряют ценность — их нужно инвестировать.'},{type:'phy',tag:'Физика',text:'Wi-Fi — электромагнитные волны 2.4–5 ГГц. Данные передаются со скоростью света.'},{type:'nat',tag:'Природа',text:'Биомимикрия: велкро придуман по репейнику, нос поезда Синкансэн — по клюву зимородка.'}],opinion:{q:'Что важнее: интеллект или трудолюбие?',opts:['Интеллект','Трудолюбие','50/50']},quest:{title:'Анализ расходов',desc:'Составь список трат за неделю, раздели на категории.',steps:['Вспомни траты за 7 дней','Категории: еда, развлечения, транспорт','Посчитай % каждой категории','Найди где сэкономить 20%'],pts:200,crit:'Показал таблицу с категориями'},dinner:'Какой навык хочешь развить этим летом?'}
};

// ── STATE ──
var curChild=CHILDREN[0].id;
var curTab='today';
var childData={};
var pendingReviews=[];
var digestCache={};
var apiKey='';
var unsubscribers=[];
var pb='';
var lastDay=Math.floor(Date.now()/86400000);

// Pre-populate with defaults so UI renders immediately
CHILDREN.forEach(function(c){
  childData[c.id]={pts:0,wpts:0,done:[],mood:null,diary:[],goal:null,vote:null,vday:-1,weekProject:null};
});

// ── FIREBASE HELPERS ──
async function loadApiKey(){
  try{
    var d=await getDoc(doc(db,'config','settings'));
    if(d.exists()&&d.data().claudeApiKey)apiKey=d.data().claudeApiKey;
  }catch(e){}
}

async function saveApiKey(key){
  apiKey=key;
  await setDoc(doc(db,'config','settings'),{claudeApiKey:key},{merge:true});
}

function subscribeChild(id){
  var unsub=onSnapshot(doc(db,'children',id),function(snap){
    if(snap.exists())childData[id]=snap.data();
    else childData[id]={pts:0,wpts:0,done:[],mood:null,diary:[],goal:null,vote:null,vday:-1,weekProject:null};
    if(curChild===id)renderContent();
    renderStrip();
  });
  unsubscribers.push(unsub);
}

function subscribePending(){
  var unsub=onSnapshot(collection(db,'pending'),function(snap){
    pendingReviews=[];
    snap.forEach(function(d){pendingReviews.push({id:d.id,...d.data()});});
    if(document.getElementById('sp')&&!document.getElementById('sp').classList.contains('hidden'))renderParent(); else renderContent();
  });
  unsubscribers.push(unsub);
}

async function updateChild(id,data){
  await setDoc(doc(db,'children',id),data,{merge:true});
}

async function addPoints(childId,pts){
  await updateDoc(doc(db,'children',childId),{pts:increment(pts),wpts:increment(pts)});
}

function getCS(){return childData[curChild]||{pts:0,wpts:0,done:[],mood:null,diary:[],goal:null,vote:null,vday:-1};}
function getCH(){return CHILDREN.find(function(c){return c.id===curChild;});}

// ── PIN ──
function opov(){pb='';updDots();document.getElementById('perr').classList.add('hidden');document.getElementById('pov').classList.remove('hidden');}
function cpov(){document.getElementById('pov').classList.add('hidden');}
function pk(k){
  if(pb.length>=4)return;pb+=k;updDots();
  if(pb.length===4){
    if(pb===PIN){cpov();showParent();}
    else{document.getElementById('perr').classList.remove('hidden');setTimeout(function(){pb='';updDots();document.getElementById('perr').classList.add('hidden');},900);}
  }
}
function pdel(){if(pb.length>0){pb=pb.slice(0,-1);updDots();}}
function updDots(){for(var i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('on',i<pb.length);}

// ── NAV ──
function stab(t,btn){
  curTab=t;
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  renderContent();
}

function renderStrip(){
  document.getElementById('cstrip').innerHTML=CHILDREN.map(function(c){
    var pend=(pendingReviews||[]).filter(function(p){return p.childId===c.id&&p.status==='pending';}).length;
    return '<div class="cchip'+(c.id===curChild?' on':'')+'" data-child="'+c.id+'">'
      +'<span class="cav">'+c.av+(pend>0?'<sup style="font-size:9px;color:var(--g)">'+pend+'</sup>':'')+'</span>'
      +'<span class="cn">'+c.name+'</span>'
      +'<span class="ca">'+c.age+' лет</span>'
      +'</div>';
  }).join('');
}
function selChild(id){curChild=id;renderStrip();renderContent();}

function showParent(){document.getElementById('sc').classList.add('hidden');document.getElementById('sp').classList.remove('hidden');renderParent();}
function bk(){document.getElementById('sp').classList.add('hidden');document.getElementById('sc').classList.remove('hidden');}
function renderContent(){
  var el=document.getElementById('cc');
  if(!el)return;
  try{
    if(curTab==='today')renderToday(el);
    else if(curTab==='quests')renderQuests(el);
    else if(curTab==='project')el.innerHTML=renderProject();
    else if(curTab==='diary')el.innerHTML=renderDiary();

// ── DIGEST / API ──
function gday(){return Math.floor(Date.now()/86400000)}
function getWeekNum(){return Math.floor((Date.now()-new Date('2025-06-09').getTime())/(7*86400000))}

async function callApi(gr){
  if(!apiKey)return null;
  var wn=getWeekNum();
  var theme=WEEK_THEMES[Math.min(wn,WEEK_THEMES.length-1)];
  var now=new Date();
  var dayNum=Math.floor((Date.now()-new Date('2025-06-09').getTime())/86400000)+1;
  var isJ=(gr==='j');
  var questGuide=isJ
    ?'Квест ПРАКТИЧЕСКИЙ — руками: построить, вырастить, смастерить, опыт. НЕ рисование. Примеры: вулкан из соды, прорастить фасоль, мост из бумаги, кристаллы соли, компас из иголки.'
    :'Квест интеллектуальный: анализ, исследование, финансовый расчёт, создание плана.';
  var projGuide=isJ
    ?'Проект практический — вырастить, построить, провести опыты. Каждый день — физическое действие с детальной инструкцией.'
    :'Проект — создать что-то полезное: финансовый план, бизнес-идею, исследование, освоить навык.';
  var prompt='Сегодня '+DAYS[now.getDay()]+', '+now.getDate()+' '+MON[now.getMonth()]+' 2025. День #'+dayNum+'. Тема: «'+theme+'».\n\n'
    +'Дайджест для '+(isJ?'детей 8-10 лет (игровой тон, простые слова)':'подростка 15 лет (уважительный, серьёзный тон)')+'.\n\n'
    +'ПРАВИЛА:\n'
    +'1. Факты — из РАЗНЫХ стран мира, не только Казахстан. 1 факт может быть о КЗ, 2 других — о мире.\n'
    +'2. Мнение дня — простой жизненный вопрос. БЕЗ слов: лагерь, лето, каникулы.\n'
    +'3. Вопрос за ужином — философский или познавательный вопрос для семьи. НЕ про еду и НЕ про меню.\n'
    +'4. '+questGuide+'\n'
    +'5. В квесте steps — минимум 5 подробных шагов КАК делать.\n'
    +'6. '+projGuide+'\n'
    +'7. В проекте days — КАЖДЫЙ ДЕНЬ должен содержать: что делать + пошаговую инструкцию КАК (например не "посади семена", а "Возьми стакан, насыпь 2 см земли, сделай ямку пальцем 1 см, положи 2-3 семечка, засыпь, полей 3 ложки воды").\n'    +'8. Викторина — 2 вопроса строго по тексту фактов дня (ответ есть в фактах) + 1 вопрос на размышление по теме дня. 3 варианта ответа, один правильный.\n'    +'9. Слово дня — одно интересное слово связанное с темой. Для детей 8-10 лет: простое но необычное. Для подростка 15 лет: из науки, экономики или философии. Объяснение простыми словами + яркая аналогия.\n\n'
    +'Только валидный JSON без markdown:\n'
    +'{"facts":[{"type":"fin","tag":"Финансы","text":"..."},{"type":"phy","tag":"Физика","text":"..."},{"type":"nat","tag":"Природа","text":"..."}],'
    +'"opinion":{"q":"Вопрос?","opts":["А","Б","В"]},'
    +'"quest":{"title":"...","desc":"Зачем это круто (2-3 предл)","steps":["Шаг 1 подробно","Шаг 2","Шаг 3","Шаг 4","Шаг 5"],"pts":'+(isJ?100:200)+',"crit":"Что должно получиться"},'
    +'"weekProject":{"title":"...","desc":"...","mats":["...","...","..."],"days":["День 1: действие + детальная инструкция КАК","День 2: действие + инструкция","День 3: действие + инструкция","День 4: действие + инструкция","День 5: действие + инструкция","День 6: действие + инструкция","День 7: финальное действие + что должно получиться"],"pts":'+(isJ?500:800)+'},'
    +'"dinner":"Открытый вопрос для семейного обсуждения (не про еду)",' +'"quiz":[{"q":"Вопрос 1?","opts":["А","Б","В"],"ans":0},{"q":"Вопрос 2?","opts":["А","Б","В"],"ans":1},{"q":"Вопрос 3 на размышление?","opts":["А","Б","В"],"ans":2}],' +'"word":{"w":"Слово","def":"Объяснение простыми словами","ex":"Яркая аналогия или пример из жизни"}}';
  try{
    var resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:4500,messages:[{role:'user',content:prompt}]})
    });
    if(!resp.ok)throw new Error(resp.status);
    var d=await resp.json();
    return JSON.parse(d.content[0].text.trim().replace(/```json|```/g,'').trim());
  }catch(e){console.error('API error:',e);return null;}

async function fetchDigest(gr){
  var ckey='dig_'+gr+'_'+gday();
  if(digestCache[gr])return digestCache[gr];
  try{var r=localStorage.getItem(ckey);if(r){digestCache[gr]=JSON.parse(r);return digestCache[gr];}}catch(e){}
  var parsed=await callApi(gr);
  if(parsed){
    digestCache[gr]=parsed;
    try{localStorage.setItem(ckey,JSON.stringify(parsed));}catch(e){}
  }
  return parsed;
}

function buildQuizHtml(quiz, cs) {
  if(!quiz||!quiz.length) return '';
  var today = gday();
  var done = (cs.quizDone||[]);
  var quizDay = cs.quizDay||0;
  if(quizDay !== today) done = [];
  var h = '<div class="card"><div class="ch"><i class="ti ti-brain"></i>Викторина дня<span style="margin-left:auto;font-size:11px;color:var(--t3)">+30 за каждый ✓</span></div>';
  quiz.forEach(function(q, qi) {
    var answered = done.indexOf(qi) >= 0;
    h += '<div class="qz-q" id="qz'+qi+'" style="margin-bottom:14px">';
    h += '<div style="font-size:13px;font-weight:600;color:var(--t);margin-bottom:8px;line-height:1.4">'+(qi+1)+'. '+q.q+'</div>';
    q.opts.forEach(function(opt, oi) {
      var state = '';
      if(answered) {
        if(oi === q.ans) state = 'background:var(--gl);border-color:var(--g);color:var(--gd);font-weight:600';
        else state = 'opacity:0.4';
      }
      h += '<button class="qz-opt" data-qi="'+qi+'" data-oi="'+oi+'" data-ans="'+q.ans+'" data-pts="30" '
        +(answered?'disabled':'')+' style="'+state+'">'
        +(answered && oi===q.ans ? '✓ ' : '')+opt+'</button>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

window.answerQuiz = async function(qi, oi, ans, pts) {
  var today = gday();
  var cs = getCS();
  var done = (cs.quizDay===today) ? (cs.quizDone||[]).slice() : [];
  if(done.indexOf(qi) >= 0) return;
  done.push(qi);
  await updateChild(curChild, {quizDone: done, quizDay: today});
  if(oi === ans) {
    await addPoints(curChild, pts);
    toast('Правильно! +'+pts+' очков 🎉');
  } else {
    toast('Неверно 😔 Правильный ответ выделен');
  }
};

window.previewPh=function(){
  var file=document.getElementById('ph-file').files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var MAX=600,w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      var resized=canvas.toDataURL('image/jpeg',0.5);
      document.getElementById('ph-prev').innerHTML='<img src="'+resized+'" style="width:100%;height:100%;object-fit:cover;border-radius:var(--rs)">';
      var btn=document.getElementById('ph-submit');
      if(btn){btn.disabled=false;btn.style.opacity='1';btn.dataset.photo=resized;}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
};

      qid:qid,pts:pts,photoUrl:photoUrl,date:ds,status:'pending',createdAt:serverTimestamp()
    });
    var po=document.getElementById('photo-ov');if(po)po.remove();
    renderContent();
    toast('Отправлено папе! ⏳');
  }catch(e){
    console.error(e);
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-send"></i>Отправить';}
    toast('Ошибка — попробуй ещё раз');
  }
};

// ── WEEKLY PROJECT ──
function getWeekStart(){
  var now=new Date(),day=now.getDay()||7;
  var mon=new Date(now);mon.setDate(now.getDate()-(day-1));
  return mon.toISOString().slice(0,10);
}

async function storeWeekProject(wp,gr){
  var weekStart=getWeekStart();
  for(var i=0;i<CHILDREN.length;i++){
    var c=CHILDREN[i];
    if(c.gr!==gr)continue;
    var cs=childData[c.id]||{};
    if(cs.weekProject&&cs.weekProject.weekStart===weekStart)continue;
    await updateChild(c.id,{weekProject:{weekStart:weekStart,title:wp.title,desc:wp.desc,mats:wp.mats||[],days:wp.days||[],pts:wp.pts,done:false,daysDone:[]}});
  }
}

async function storeWeekProjectForce(wp,gr){
  var weekStart=getWeekStart();
  for(var i=0;i<CHILDREN.length;i++){
    var c=CHILDREN[i];
    if(c.gr!==gr)continue;
    await updateChild(c.id,{weekProject:{weekStart:weekStart,title:wp.title,desc:wp.desc,mats:wp.mats||[],days:wp.days||[],pts:wp.pts,done:false,daysDone:[]}});
  }
}

window.recalc=function(){
  var tot=0;
  CHILDREN.forEach(function(c){
    var cs=childData[c.id]||{};
    var pct=Math.min(1,(cs.wpts||0)/c.maxW);
    var base=pct>=0.3?Math.round(pct*c.maxP):0;
    var inp=document.getElementById('bn-'+c.id);
    tot+=base+(inp?parseInt(inp.value||0)||0:0);
  });
  var el=document.getElementById('tpay');
  if(el)el.textContent=tot.toLocaleString('ru')+' тг';
};

window.approveQ=async function(pendId,childId,pts,qid){
  await updateDoc(doc(db,'pending',pendId),{status:'approved'});
  var cs=childData[childId]||{};
  var done=(cs.done||[]).slice();
  if(done.indexOf(qid)<0)done.push(qid);
  await updateChild(childId,{done:done});
  await addPoints(childId,pts);
  toast(CHILDREN.find(function(c){return c.id===childId;}).name+' +'+pts+' очков! ✅');
};

window.rejectQ=async function(pendId,childId){
  await updateDoc(doc(db,'pending',pendId),{status:'rejected'});
  toast('Задание отклонено — ребёнок может переделать');
};

window.confPay=async function(){
  var now=new Date();
  var ds=now.getDate()+' '+MON[now.getMonth()]+' '+now.getFullYear();
  var rows=[];
  for(var i=0;i<CHILDREN.length;i++){
    var c=CHILDREN[i];
    var cs=childData[c.id]||{};
    var pct=Math.min(1,(cs.wpts||0)/c.maxW);
    var base=pct>=0.3?Math.round(pct*c.maxP):0;
    var inp=document.getElementById('bn-'+c.id);
    var b=inp?parseInt(inp.value||0)||0:0;
    rows.push({av:c.av,name:c.name,total:base+b});
    await updateChild(c.id,{wpts:0,done:[]});
  }
  var hist=[];
  try{var h=localStorage.getItem('payHistory');if(h)hist=JSON.parse(h);}catch(e){}
  hist.unshift({date:ds,rows:rows});
  try{localStorage.setItem('payHistory',JSON.stringify(hist.slice(0,20)));}catch(e){}
  toast('Выплата подтверждена! 💰');
  renderParent();
};

    +'<div style="font-size:13px;color:var(--t2);margin-bottom:14px;line-height:1.6">Ключ хранится в Firebase. Дети видят новый контент каждый день.</div>'
    +'<input id="api-inp" type="password" value="'+apiKey+'" placeholder="sk-ant-api03-..." style="width:100%;border:1.5px solid var(--b);border-radius:var(--rs);padding:12px;font-size:13px;color:var(--t);background:var(--s);margin-bottom:8px;font-family:monospace">'
    +'<div style="font-size:11px;color:var(--t3);margin-bottom:16px;padding:8px 10px;background:var(--s2);border-radius:var(--rs)">console.anthropic.com → API Keys → скопируй ключ</div>'
    +'<button class="btn bg" style="margin-bottom:10px" id="btn-api-save"><i class="ti ti-check"></i>Сохранить</button>'
    +'<button class="btn bo" id="btn-api-cancel">Отмена</button>'
    +'</div>';
  document.body.appendChild(ov);
};
window.doSaveApiKey=async function(){
  var inp=document.getElementById('api-inp');
  if(!inp||!inp.value.trim()){toast('Введи ключ!');return;}
  await saveApiKey(inp.value.trim());
  digestCache={};
  document.getElementById('api-ov').remove();
  toast('Ключ сохранён! ✓');
  setTimeout(function(){renderContent();},300);
};

// ── TOAST ──
function toast(msg){var t=document.getElementById('tst');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}

// ── PIN SETUP ──
function setupPin(){
  var pad=document.getElementById('pin-pad');
  if(!pad)return;
  var keys=['1','2','3','4','5','6','7','8','9','empty','0','del'];
  pad.innerHTML=keys.map(function(k){
    if(k==='empty')return '<button class="pk empty"></button>';
    if(k==='del')return '<button class="pk del" data-pin-del="1">⌫</button>';
    return '<button class="pk" data-pin-key="'+k+'">'+k+'</button>';
  }).join('');
}

// ── MASTER EVENT DELEGATION ──
function setupEvents(){
  document.addEventListener('click',async function(e){
    var t=e.target;
    var el=t.closest ? t : t;

    // nav tabs
    var nb=t.closest('.nb');
    if(nb&&nb.dataset.tab){stab(nb.dataset.tab,nb);return;}

    // child selector
    var cc=t.closest('.cchip');
    if(cc&&cc.dataset.child){selChild(cc.dataset.child);return;}

    // parent button
    if(t.closest('#btn-parent')){opov();return;}

    // back button
    if(t.closest('#btn-back')){bk();return;}

    // pin cancel
    if(t.closest('#pin-cancel')){cpov();return;}

    // pin keys
    var pk2=t.closest('[data-pin-key]');
    if(pk2){pk(pk2.dataset.pinKey);return;}
    if(t.closest('[data-pin-del]')){pdel();return;}

    // mood
    var mb=t.closest('[data-mood]');
    if(mb){await setMood(parseInt(mb.dataset.mood));return;}

    // vote
    var vb=t.closest('[data-vote]');
    if(vb&&!vb.disabled){await voteOp(parseInt(vb.dataset.vote));return;}

    // quiz answer
    var qz=t.closest('[data-qi]');
    if(qz&&!qz.disabled){await answerQuiz(parseInt(qz.dataset.qi),parseInt(qz.dataset.oi),parseInt(qz.dataset.ans),parseInt(qz.dataset.pts));return;}

    // photo quest button
    var pq=t.closest('[data-photo-quest]');
    if(pq){openPhotoSheet(pq.dataset.photoQuest,parseInt(pq.dataset.photoPts));return;}

    // toggle day
    var td=t.closest('[data-toggle-day]');
    if(td){await toggleDay(parseInt(td.dataset.toggleDay));return;}

    // goto project from reminder
    var gp=t.closest('[data-goto]');
    if(gp){stab(gp.dataset.goto,document.getElementById('nb2'));return;}

    // generate project from parent panel
    if(t.closest('#btn-gen-project-parent')){
      var btn3=t.closest('#btn-gen-project-parent');
      btn3.innerHTML='<div class="spin" style="width:20px;height:20px;border-width:2px;margin:0 auto"></div>';
      btn3.disabled=true;
      // clear all caches
      digestCache={j:null,s:null};
      try{localStorage.removeItem('dig_j_'+gday());localStorage.removeItem('dig_s_'+gday());}catch(e){}
      // call API sequentially — j first, then s (avoids cache collision)
      (async function(){
        toast('Генерирую проект для младших...');
        var dj=await callApi('j');
        if(dj){digestCache.j=dj;await storeWeekProjectForce(dj.weekProject,'j');}
        toast('Генерирую проект для Аслана...');
        var ds=await callApi('s');
        if(ds){digestCache.s=ds;await storeWeekProjectForce(ds.weekProject,'s');}
        if(dj||ds){toast('Проекты готовы для всех! 🌱');}
        else{toast('Ошибка — проверь API-ключ');}
        renderParent();
      })();
      return;
    }
    // goal save
    if(t.closest('#btn-save-goal')){await saveGoal();return;}

    // goal edit
    if(t.closest('#btn-edit-goal')){await editGoal();return;}

    // conf pay
    if(t.closest('#btn-conf-pay')){await confPay();return;}

    // api setup
    if(t.closest('#btn-api-setup')){showApiSetup();return;}

    // approve
    var ap=t.closest('[data-approve]');
    if(ap){await approveQ(ap.dataset.approve,ap.dataset.childId,parseInt(ap.dataset.pts),ap.dataset.qid);return;}

    // reject
    var rj=t.closest('[data-reject]');
    if(rj){await rejectQ(rj.dataset.reject,rj.dataset.childId);return;}

    // photo overlay — preview file
    if(t.id==='ph-prev'||t.closest('#ph-prev')){
      var fi=document.getElementById('ph-file');
      if(fi)fi.click();
      return;
    }

    // api save
    if(t.id==='btn-api-save'||t.closest('#btn-api-save')){await doSaveApiKey();return;}

    // api cancel
    if(t.id==='btn-api-cancel'||t.closest('#btn-api-cancel')){
      var ao=document.getElementById('api-ov');if(ao)ao.remove();return;
    }

    // photo submit
    if(t.id==='ph-submit'||t.closest('#ph-submit')){
      var pb2=document.getElementById('ph-submit');
      if(pb2)await submitPh(pb2.dataset.qid,parseInt(pb2.dataset.pts));
      return;
    }

    // photo cancel
    if(t.id==='ph-cancel'||t.closest('#ph-cancel')){
      var po=document.getElementById('photo-ov');if(po)po.remove();return;
    }

    // file change handled separately
  });

  document.addEventListener('change',function(e){
    if(e.target.id==='ph-file')previewPh();
    if(e.target.dataset.bonusInput)recalc();
  });
}

// ── INIT ──
async function init(){
  var now=new Date();
  document.getElementById('hdate').textContent=DAYS[now.getDay()]+', '+now.getDate()+' '+MON[now.getMonth()]+' 2025';
  setupPin();
  setupEvents();
  CHILDREN.forEach(function(c){subscribeChild(c.id);});
  subscribePending();
  await loadApiKey();
  renderStrip();
  renderContent();
  setInterval(function(){
    var newDay=Math.floor(Date.now()/86400000);
    if(newDay!==lastDay){
      lastDay=newDay;
      digestCache={};
      var now=new Date();
      document.getElementById('hdate').textContent=DAYS[now.getDay()]+', '+now.getDate()+' '+MON[now.getMonth()]+' 2025';
      renderContent();
    }
  },60000);
}
init();
</script>
