function subscribeDigest(){
  ['j','m','s'].forEach(function(gr){
    var unsub=onSnapshot(doc(db,'config','digest_'+gr),function(snap){
      if(!snap.exists())return;
      var data=snap.data();
      if(!data||!data.facts)return;
      var today=gday();
      if(data.day!==today)return;
      digestCache[gr]=data;
      try{localStorage.setItem('dig_'+gr+'_'+today,JSON.stringify(data));}catch(e){}
      var sp=document.getElementById('sp');
      if(sp&&!sp.classList.contains('hidden'))return;
      var ch=getCH();
      if(ch&&ch.gr===gr)renderContent();

    unsubscribers.push(unsub);
  });
}

async function fetchDigest(gr){
  var today=gday();
  var ckey='dig_'+gr+'_'+today;
  if(digestCache[gr])return digestCache[gr];
  try{var r=localStorage.getItem(ckey);if(r){digestCache[gr]=JSON.parse(r);return digestCache[gr];}}catch(e){}
  try{
    var snap=await getDoc(doc(db,'config','digest_'+gr));
    if(snap.exists()&&snap.data()&&snap.data().day===today&&snap.data().facts){
      digestCache[gr]=snap.data();
      try{localStorage.setItem(ckey,JSON.stringify(snap.data()));}catch(e){}
      return digestCache[gr];
    }
  }catch(e){}
  // Автогенерация — но НЕ трогаем weekProject если он уже есть на этой неделе
  var parsed=await callApi(gr);
  if(parsed){
    parsed.day=today;
    // Защита недельного проекта: если уже есть актуальный — не перезаписываем
    var weekStart=getWeekStart();
    var hasActiveProject=false;
    for(var i=0;i<CHILDREN.length;i++){
      var c=CHILDREN[i];
      if(c.gr!==gr)continue;
      var cs=childData[c.id]||{};
      if(cs.weekProject&&cs.weekProject.weekStart===weekStart){hasActiveProject=true;break;}
    }
    digestCache[gr]=parsed;
    try{localStorage.setItem(ckey,JSON.stringify(parsed));}catch(e){}
    try{await setDoc(doc(db,'config','digest_'+gr),parsed);}catch(e){}
    // Записываем проект только если его ещё нет на эту неделю
    if(parsed.weekProject&&!hasActiveProject){
      await storeWeekProject(parsed.weekProject,gr);
    }
  }
  return parsed;
}

function buildQuizHtml(quiz, cs) {
  if(!quiz||!quiz.length) return '';
  var today = gday();
  var done = (cs.quizDone||[]);
  var quizDay = cs.quizDay||0;
  if(quizDay !== today) done = [];
  var h = '<div class="card"><div class="ch"><i class="ti ti-brain"></i>Викторина дня<span style="margin-left:auto;font-size:11px;color:var(--t3)">+30 за каждый ✓</span></div>';
  quiz.forEach(function(q, qi) {
    var answered = done.indexOf(qi) >= 0;
    h += '<div class="qz-q" id="qz'+qi+'" style="margin-bottom:14px">';
    h += '<div style="font-size:13px;font-weight:600;color:var(--t);margin-bottom:8px;line-height:1.4">'+(qi+1)+'. '+q.q+'</div>';
    q.opts.forEach(function(opt, oi) {
      var state = '';
      if(answered) {
        if(oi === q.ans) state = 'background:var(--gl);border-color:var(--g);color:var(--gd);font-weight:600';
        else state = 'opacity:0.4';
      }
      h += '<button class="qz-opt" data-qi="'+qi+'" data-oi="'+oi+'" data-ans="'+q.ans+'" data-pts="30" '
        +(answered?'disabled':'')+' style="'+state+'">'
        +(answered && oi===q.ans ? '✓ ' : '')+opt+'</button>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

window.answerQuiz = async function(qi, oi, ans, pts) {
  var today = gday();

  var done = (cs.quizDay===today) ? (cs.quizDone||[]).slice() : [];

};

function renderQuests(el){

  if(digest){el.innerHTML=buildQuestsHtml(digest,ch.gr,cs);}
  else{
    el.innerHTML='<div class="loader"><div class="spin"></div><div class="loader-txt">Загружаю квесты...</div></div>';

      el.innerHTML=buildQuestsHtml(data,ch.gr,cs);

function questStatus(cs,qid){
  var done=cs.done||{};
  // support old array format
  if(Array.isArray(done)){
    // migrate: ignore old array, treat as empty
    done={};
  }
  if(done[qid]===gday())return 'done';
  var pend=pendingReviews.filter(function(p){return p.childId===curChild&&p.qid===qid&&p.status==='pending';});
  if(pend.length>0)return 'pending';
  return 'none';
}

function questBtn(cs,qid,pts,label,icon){
  var st=questStatus(cs,qid);
  if(st==='done')return '<button class="btn bd" disabled><i class="ti ti-check"></i>Выполнено! ✅</button>';
  if(st==='pending')return '<button class="btn" style="background:var(--al);color:var(--am);border:1.5px solid #EF9F27" disabled><i class="ti ti-clock"></i>Ожидает проверки папы ⏳</button>';
  return '<button class="btn bg" data-photo-quest="'+qid+'" data-photo-pts="'+pts+'"><i class="ti ti-camera"></i>'+label+'</button>';
}

function buildQuestsHtml(data,gr,cs){
  var q=data&&data.quest?data.quest:FALLBACK[gr].quest;
  var h='<div class="slbl">Быстрый квест — сегодня</div>';
  h+='<div class="qcard"><div class="qtr"><div class="qn">'+q.title+'</div><div class="qp">+'+q.pts+' очков</div></div>'
    +'<div class="qd">'+q.desc+'</div>'
    +'<ol class="slist">'+q.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'
    +'<div class="crit">📸 Сделай фото — папа проверит и начислит очки</div>'
    +questBtn(cs,'qt',q.pts,'Сделал! Отправить фото','camera')+'</div>';
  // Family quest from group m digest
  var fqData=digestCache['m'];
  var fq=fqData&&fqData.familyQuest?fqData.familyQuest:null;
  h+='<div class="slbl">Семейный квест — вечером вместе</div>';
  if(fq){
    h+='<div class="qcard"><div class="qtr"><div class="qn">👨‍👩‍👧‍👦 '+fq.title+'</div><div class="qp">+'+fq.pts+' очков</div></div>'
      +'<div class="qd">'+fq.desc+'</div>'
      +'<ol class="slist">'+fq.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'
      +'<div class="crit">📸 Сделайте общее фото</div>'
      +questBtn(cs,'fq',fq.pts,'Сделали! Отправить фото','users')+'</div>';
  } else {
    h+='<div class="qcard"><div class="qd" style="color:var(--t2);font-size:13px">⏳ Загружается семейный квест...</div></div>';
  }
  // Dinner question
  var dinner=data&&data.dinner?data.dinner:(fqData&&fqData.dinner?fqData.dinner:null);
  if(dinner){
    h+='<div class="slbl">Вопрос за ужином</div>';
    h+=buildDinnerHtml(dinner);
  }
  return h;
}

window.previewPh=function(){
  var file=document.getElementById('ph-file').files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var MAX=600,w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      var resized=canvas.toDataURL('image/jpeg',0.5);
      document.getElementById('ph-prev').innerHTML='<img src="'+resized+'" style="width:100%;height:100%;object-fit:cover;border-radius:var(--rs)">';
      var btn=document.getElementById('ph-submit');
      if(btn){btn.disabled=false;btn.style.opacity='1';btn.dataset.photo=resized;}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
};

// ── WEEKLY PROJECT ──
function getWeekStart(){
  var now=new Date(),day=now.getDay()||7;
  var mon=new Date(now);mon.setDate(now.getDate()-(day-1));
  return mon.toISOString().slice(0,10);
}

async function storeWeekProject(wp,gr){
  var weekStart=getWeekStart();
  for(var i=0;i<CHILDREN.length;i++){
    var c=CHILDREN[i];
    if(c.gr!==gr)continue;
    // Читаем из Firestore напрямую — в памяти (childData) может быть null из-за race condition
    try{
      var snap=await getDoc(doc(db,'children',c.id));
      var cs=snap.exists()?snap.data():{};
      if(cs.weekProject&&cs.weekProject.weekStart===weekStart)continue;
    }catch(e){
      var cs2=childData[c.id]||{};
      if(cs2.weekProject&&cs2.weekProject.weekStart===weekStart)continue;
    }
    await updateChild(c.id,{weekProject:{weekStart:weekStart,title:wp.title,desc:wp.desc,mats:wp.mats||[],days:wp.days||[],pts:wp.pts,done:false,daysDone:[]}});
  }
}

async function storeWeekProjectForce(wp,gr){
  var weekStart=getWeekStart();
  for(var i=0;i<CHILDREN.length;i++){
    var c=CHILDREN[i];
    if(c.gr!==gr)continue;
    await updateChild(c.id,{weekProject:{weekStart:weekStart,title:wp.title,desc:wp.desc,mats:wp.mats||[],days:wp.days||[],pts:wp.pts,done:false,daysDone:[]}});
  }
}

      +'<div style="font-size:13px;color:var(--t);line-height:1.4">'+d+'</div></div></div>';

  var todayTask=wp.days&&wp.days[todayNum-1];

  if(!isDone&&todayTask){
    reminderCard='<div class="card" style="border-color:'+(todayDone?'var(--gm)':'#EF9F27')+'"><div class="ch" style="color:'+(todayDone?'var(--gd)':'#BA7517')+'"><i class="ti ti-'+(todayDone?'circle-check':'alarm')+'"></i>Задание на сегодня</div>'
      +'<div style="font-size:14px;color:var(--t);line-height:1.5;margin-bottom:10px">'+todayTask+'</div>'
      +(todayDone?'<div style="font-size:12px;color:var(--gd);font-weight:500">✓ Сегодня выполнено</div>'
        :'<button class="btn bg" data-toggle-day="'+todayNum+'"><i class="ti ti-check"></i>Отметить — сделал сегодня!</button>')
      +'</div>';
  }
  var finBtn='';
  if(!isDone&&!isPending&&(wp.daysDone||[]).length>=5){
    finBtn='<button class="btn bg" style="margin-top:8px" data-photo-quest="wp" data-photo-pts="'+wp.pts+'"><i class="ti ti-camera"></i>Завершить проект — отправить фото!</button>';
  } else if(isPending){
    finBtn='<button class="btn" style="background:var(--al);color:var(--am);border:1.5px solid #EF9F27;margin-top:8px" disabled><i class="ti ti-clock"></i>Ожидает проверки папы ⏳</button>';
  } else if(isDone){
    finBtn='<button class="btn bd" disabled style="margin-top:8px"><i class="ti ti-trophy"></i>Проект завершён! 🎉</button>';

    +'<div class="card"><div class="ch"><i class="ti ti-plant"></i>'+wp.title+'<span style="font-size:11px;font-weight:500;color:var(--t3);margin-left:auto">+'+wp.pts+' очков</span></div>'
    +'<div style="font-size:13px;color:var(--t2);margin-bottom:10px;line-height:1.5">'+wp.desc+'</div>'

    +'<div class="wb" style="margin-bottom:12px"><div class="wbf" style="width:'+pct+'%"></div></div>'
    +daysHtml+finBtn+'</div>'
    +(wp.mats&&wp.mats.length?'<div class="card"><div class="ch"><i class="ti ti-list"></i>Что нужно</div>'
      +'<div style="font-size:13px;color:var(--t);line-height:1.8">'+wp.mats.map(function(m){return '• '+m;}).join('<br>')+'</div></div>':'');
}

    +'\nans — индекс правильного ответа (0-3). Ровно 20 вопросов.';
  try{
    var resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:4000,messages:[{role:'user',content:prompt}]})
    });
    var data=await resp.json();
    var txt=data.content.map(function(i){return i.text||'';}).join('');
    var clean=txt.replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(clean);
    if(parsed.questions&&parsed.questions.length===20){
      activeBookTest={bookId:book.id,title:book.title,questions:parsed.questions,answers:new Array(20).fill(null)};
      renderContent();
      toast('Тест готов! Ответь на 20 вопросов');
    }else{toast('Ошибка генерации теста — попробуй снова');}
  }catch(e){toast('Ошибка: '+e.message);}
}

function renderBookTest(){
  var test=activeBookTest;
  var h='<div class="slbl">📖 Тест: «'+test.title+'»</div>';
  var answered=test.answers.filter(function(a){return a!==null;}).length;
  h+='<div style="font-size:12px;color:var(--t2);margin-bottom:12px">Отвечено: '+answered+'/20</div>';
  test.questions.forEach(function(q,qi){
    h+='<div class="qcard" style="margin-bottom:8px">';
    h+='<div style="font-size:13px;font-weight:600;color:var(--t);margin-bottom:8px;line-height:1.4">'+(qi+1)+'. '+q.q+'</div>';
    q.opts.forEach(function(opt,oi){
      var sel=test.answers[qi]===oi;
      h+='<button class="qz-opt" data-bq="'+qi+'" data-bo="'+oi+'" style="'+(sel?'border-color:var(--p);background:var(--s2);font-weight:600':'')+'">'+opt+'</button>';

function renderBookSection(cs,gr){
  var books=getBooksForGr(gr);
  var done=(!cs.done||Array.isArray(cs.done))?{}:(cs.done||{});
  var h='<div class="slbl">📚 Прочитать книгу</div>';
  h+='<div style="font-size:12px;color:var(--t2);margin-bottom:12px;line-height:1.5">Прочитай книгу и пройди тест из 20 вопросов. За каждую книгу — 10 000 тг к выплате!</div>';
  books.forEach(function(b){
    var st=done['book_'+b.id];
    var pend=pendingReviews.some(function(p){return p.childId===curChild&&p.qid==='book_'+b.id&&p.status==='pending';});
    var approved=pendingReviews.some(function(p){return p.childId===curChild&&p.qid==='book_'+b.id&&p.status==='approved';});
    h+='<div class="qcard" style="margin-bottom:8px">';

    } else {
      h+='<button class="btn bg" style="padding:6px 12px;font-size:12px" data-book-id="'+b.id+'" data-book-title="'+b.title+'" data-book-author="'+b.author+'">Я прочитал</button>';

window.submitBookTest=async function(){
  var test=activeBookTest;
  if(!test)return;
  var score=test.questions.filter(function(q,i){return test.answers[i]===q.ans;}).length;
  var pendId=curChild+'_book_'+test.bookId+'_'+Date.now();
  var ch=getCH();
  await setDoc(doc(db,'pending',pendId),{
    childId:curChild,childName:ch.name,childAv:ch.av,
    qid:'book_'+test.bookId,pts:0,
    bookTitle:test.title,
    score:score,
    total:20,
    questions:test.questions,
    answers:test.answers,
    date:new Date().toLocaleDateString('ru'),
    status:'pending',
    type:'book',
    createdAt:serverTimestamp()
  });
  activeBookTest=null;
  renderContent();
  toast('Тест отправлен папе! Результат: '+score+'/20 ⏳');
};

window.approveBook=async function(pendId,childId,score){

window.rejectBook=async function(pendId){

};

    +'<div class="card"><div class="ch"><i class="ti ti-refresh"></i>Контент дня</div>'+'<div style="font-size:13px;color:var(--t2);margin-bottom:10px;line-height:1.5">Обнови факты дня, викторину и слово дня для каждой группы отдельно.</div>'+'<button class="btn bg" id="btn-refresh-j" style="margin-bottom:8px"><i class="ti ti-refresh"></i>Обновить младших (Бахыт, Жасмин)</button>'+'<button class="btn bg" id="btn-refresh-m" style="margin-bottom:8px;background:var(--al);color:var(--am)"><i class="ti ti-refresh"></i>Обновить Алихана</button>'+'<button class="btn bg" id="btn-refresh-s" style="background:#667eea;color:#fff"><i class="ti ti-refresh"></i>Обновить Аслана</button></div>'    +'<div class="card"><div class="ch"><i class="ti ti-history"></i>История выплат</div>'+histHtml+'</div>';
}

window.recalc=function(){
  var tot=0;
  CHILDREN.forEach(function(c){
    var cs=childData[c.id]||{};
    var pct=Math.min(1,(cs.wpts||0)/c.maxW);
    var base=Math.round(pct*c.maxP);
    var inp=document.getElementById('bn-'+c.id);
    var bp=cs.bookPay||0;
    tot+=base+(inp?parseInt(inp.value||0)||0:0)+bp;
  });
  var el=document.getElementById('tpay');
  if(el)el.textContent=tot.toLocaleString('ru')+' тг';
};

window.approveQ=async function(pendId,childId,pts,qid){
  await updateDoc(doc(db,'pending',pendId),{status:'approved'});
  var cs=childData[childId]||{};
  var done=(!cs.done||Array.isArray(cs.done))?{}:Object.assign({},cs.done);
  done[qid]=Math.floor(Date.now()/86400000);
  await updateChild(childId,{done:done});
  await addPoints(childId,pts,({qt:'Быстрый квест',wp:'Большой проект',fq:'Семейный квест',ch_room:'Уборка комнаты',ch_gen:'Генеральная уборка',ch_dust:'Вытереть пыль',ch_water:'Полить деревья',ch_lawn:'Подстричь газон',ch_yard_j:'Уборка территории + Лакки',ch_yard_s:'Убрать траву + территория'}[qid]||qid));
  toast(CHILDREN.find(function(c){return c.id===childId;}).name+' +'+pts+' очков! ✅');
};

window.rejectQ=async function(pendId,childId){
  await updateDoc(doc(db,'pending',pendId),{status:'rejected'});
  toast('Задание отклонено — ребёнок может переделать');
};

window.confPay=async function(){
  var now=new Date();
  var ds=now.getDate()+' '+MON[now.getMonth()]+' '+now.getFullYear();
  var rows=[];
  for(var i=0;i<CHILDREN.length;i++){
    var c=CHILDREN[i];
    var cs=childData[c.id]||{};
    var pct=Math.min(1,(cs.wpts||0)/c.maxW);
    var base=Math.round(pct*c.maxP);
    var inp=document.getElementById('bn-'+c.id);
    var b=inp?parseInt(inp.value||0)||0:0;
    var bookPay=cs.bookPay||0;
    rows.push({av:c.av,name:c.name,base:base,bonus:b,bookPay:bookPay,total:base+b+bookPay});
    await updateChild(c.id,{wpts:0,done:{},bookPay:0});
  }
  var hist=[];
  try{var h=localStorage.getItem('payHistory');if(h)hist=JSON.parse(h);}catch(e){}
  hist.unshift({date:ds,rows:rows});
  try{localStorage.setItem('payHistory',JSON.stringify(hist.slice(0,20)));}catch(e){}
  toast('Выплата подтверждена! 💰');
  renderParent();
};

window.doSaveApiKey=async function(){
  var inp=document.getElementById('api-inp');
  if(!inp||!inp.value.trim()){toast('Введи ключ!');return;}
  await saveApiKey(inp.value.trim());
  digestCache={j:null,m:null,s:null};
  document.getElementById('api-ov').remove();
  toast('Ключ сохранён! ✓');
  setTimeout(function(){renderContent();},300);
};

// ── TOAST ──
function toast(msg){var t=document.getElementById('tst');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}

// ── CONFETTI ──
function spawnConfetti(){
  var colors=['#1D9E75','#5DCAA5','#FFD700','#FF6B6B','#667eea','#f093fb','#4facfe'];
  for(var i=0;i<60;i++){
    (function(i){
      setTimeout(function(){
        var el=document.createElement('div');
        el.className='confetti-piece';
        el.style.left=Math.random()*100+'vw';
        el.style.background=colors[Math.floor(Math.random()*colors.length)];
        el.style.width=(6+Math.random()*8)+'px';
        el.style.height=(6+Math.random()*8)+'px';
        el.style.borderRadius=Math.random()>0.5?'50%':'2px';
        el.style.animationDuration=(1.5+Math.random()*2)+'s';
        el.style.animationDelay='0s';
        document.body.appendChild(el);
        setTimeout(function(){el.remove();},3500);
      },i*30);
    })(i);
  }
}

// ── POINTS LOG ──
function logPoints(childId, pts, reason){
  try{
    var key='plog_'+childId;
    var log=[];
    try{var s=localStorage.getItem(key);if(s)log=JSON.parse(s);}catch(e){}
    var now=new Date();
    var timeStr=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    var dateStr=now.getDate()+' '+MON[now.getMonth()];
    log.unshift({pts:pts,reason:reason,time:timeStr,date:dateStr});
    if(log.length>50)log=log.slice(0,50);
    localStorage.setItem(key,JSON.stringify(log));
  }catch(e){}
}

function getPointsLog(childId){
  try{var s=localStorage.getItem('plog_'+childId);if(s)return JSON.parse(s);}catch(e){}
  return[];
}

// ── PIN SETUP ──
function setupPin(){
  var pad=document.getElementById('pin-pad');
  if(!pad)return;
  var keys=['1','2','3','4','5','6','7','8','9','empty','0','del'];
  pad.innerHTML=keys.map(function(k){
    if(k==='empty')return '<button class="pk empty"></button>';
    if(k==='del')return '<button class="pk del" data-pin-del="1">⌫</button>';
    return '<button class="pk" data-pin-key="'+k+'">'+k+'</button>';
  }).join('');
}

// ── MASTER EVENT DELEGATION ──
function setupEvents(){
  document.addEventListener('click',async function(e){
    var t=e.target;
    var el=t.closest ? t : t;

    // nav tabs
    var nb=t.closest('.nb');
    if(nb&&nb.dataset.tab){stab(nb.dataset.tab,nb);return;}

    // child selector
    var cc=t.closest('.cchip');
    if(cc&&cc.dataset.child){selChild(cc.dataset.child);return;}

    // parent button
    if(t.closest('#btn-parent')){opov();return;}
    if(t.closest('#btn-profile-hdr')){stab('profile',null);return;}

    // back button
    if(t.closest('#btn-back')){bk();return;}

    // pin cancel
    if(t.closest('#pin-cancel')){cpov();return;}

    // pin keys
    var pk2=t.closest('[data-pin-key]');
    if(pk2){pk(pk2.dataset.pinKey);return;}
    if(t.closest('[data-pin-del]')){pdel();return;}

    // save diary
    if(t.closest('#btn-save-diary')){await saveDiary();return;}

    // book - I read button
    var bookBtn=t.closest('[data-book-id]');
    if(bookBtn){
      var book={id:bookBtn.dataset.bookId,title:bookBtn.dataset.bookTitle,author:bookBtn.dataset.bookAuthor};
      await generateBookTest(book);
      return;
    }

    // book test - answer question
    var bq=t.closest('[data-bq]');
    if(bq&&activeBookTest){
      var qi=parseInt(bq.dataset.bq);
      var oi=parseInt(bq.dataset.bo);
      activeBookTest.answers[qi]=oi;
      renderContent();
      return;
    }

    // book test - submit
    if(t.closest('#btn-submit-book-test')){await submitBookTest();return;}

    // book test - cancel
    if(t.closest('#btn-cancel-book-test')){activeBookTest=null;renderContent();return;}

    // mood
    var mb=t.closest('[data-mood]');
    if(mb){await setMood(parseInt(mb.dataset.mood));return;}

    // vote
    var vb=t.closest('[data-vote]');
    if(vb&&!vb.disabled){await voteOp(parseInt(vb.dataset.vote));return;}

    // quiz answer
    var qz=t.closest('[data-qi]');
    if(qz&&!qz.disabled){await answerQuiz(parseInt(qz.dataset.qi),parseInt(qz.dataset.oi),parseInt(qz.dataset.ans),parseInt(qz.dataset.pts));return;}

    // photo quest button
    var pq=t.closest('[data-photo-quest]');
    if(pq){openPhotoSheet(pq.dataset.photoQuest,parseInt(pq.dataset.photoPts));return;}

    // toggle day
    var td=t.closest('[data-toggle-day]');
    if(td){await toggleDay(parseInt(td.dataset.toggleDay));return;}

    // goto project from reminder
    var gp=t.closest('[data-goto]');
    if(gp){stab(gp.dataset.goto,document.getElementById('nb2'));return;}

    // generate project from parent panel
    // gen project per group
    var genGr=null;
    if(t.closest('#btn-gen-j'))genGr='j';
    else if(t.closest('#btn-gen-m'))genGr='m';
    else if(t.closest('#btn-gen-s'))genGr='s';
    if(genGr){
      var gbtn=t.closest('#btn-gen-'+genGr);
      gbtn.innerHTML='<div class="spin" style="width:20px;height:20px;border-width:2px;margin:0 auto"></div>';
      gbtn.disabled=true;
      var genName=genGr==='j'?'младших':genGr==='m'?'Алихана':'Аслана';
      digestCache[genGr]=null;
      try{localStorage.removeItem('dig_'+genGr+'_'+gday());}catch(e){}
      (async function(){
        toast('Генерирую проект для '+genName+'...');
        var d=await callApi(genGr);
        if(d){digestCache[genGr]=d;await storeWeekProjectForce(d.weekProject,genGr);}
        if(d){toast('Проект готов для '+genName+'! 🌱');}
        else{toast('Ошибка — проверь API-ключ');}
        renderParent();
      })();
      return;
    }
    // refresh content
    // refresh content per group
    var refreshGr=null;
    if(t.closest('#btn-refresh-j'))refreshGr='j';
    else if(t.closest('#btn-refresh-m'))refreshGr='m';
    else if(t.closest('#btn-refresh-s'))refreshGr='s';
    if(refreshGr){
      var rbtn=t.closest('#btn-refresh-'+refreshGr);
      rbtn.disabled=true;rbtn.innerHTML='<div class="spin" style="width:20px;height:20px;border-width:2px;margin:0 auto"></div>';
      var grName=refreshGr==='j'?'младших':refreshGr==='m'?'Алихана':'Аслана';
      digestCache[refreshGr]=null;
      try{localStorage.removeItem('dig_'+refreshGr+'_'+gday());}catch(e){}
      (async function(){
        toast('Обновляю контент для '+grName+'...');
        var d=await callApi(refreshGr);
        if(d){d.day=gday();digestCache[refreshGr]=d;try{localStorage.setItem('dig_'+refreshGr+'_'+gday(),JSON.stringify(d));}catch(e){}try{await setDoc(doc(db,'config','digest_'+refreshGr),d);}catch(e){}}
        if(d){toast('Контент обновлён для '+grName+'! ✓');}
        else{toast('Ошибка — проверь API-ключ');}
        renderParent();
      })();
      return;
    }
    // goal save
    if(t.closest('#btn-save-goal')){await saveGoal();return;}

    // goal edit
    if(t.closest('#btn-edit-goal')){await editGoal();return;}

    // conf pay
    if(t.closest('#btn-conf-pay')){await confPay();return;}

    // api setup
    if(t.closest('#btn-api-setup')){showApiSetup();return;}

    // approve book
    var abk=t.closest('[data-approve-book]');
    if(abk){await approveBook(abk.dataset.approveBook,abk.dataset.childId,parseInt(abk.dataset.score));return;}

    // reject book
    var rbk=t.closest('[data-reject-book]');
    if(rbk){await rejectBook(rbk.dataset.rejectBook);return;}

    // approve
    var ap=t.closest('[data-approve]');
    if(ap){await approveQ(ap.dataset.approve,ap.dataset.childId,parseInt(ap.dataset.pts),ap.dataset.qid);return;}

    // reject
    var rj=t.closest('[data-reject]');
    if(rj){await rejectQ(rj.dataset.reject,rj.dataset.childId);return;}

    // photo overlay — preview file
    if(t.id==='ph-prev'||t.closest('#ph-prev')){
      var fi=document.getElementById('ph-file');
      if(fi)fi.click();
      return;
    }

    // api save
    if(t.id==='btn-api-save'||t.closest('#btn-api-save')){await doSaveApiKey();return;}

    // api cancel
    if(t.id==='btn-api-cancel'||t.closest('#btn-api-cancel')){
      var ao=document.getElementById('api-ov');if(ao)ao.remove();return;
    }

    // photo submit
    if(t.id==='ph-submit'||t.closest('#ph-submit')){
      var pb2=document.getElementById('ph-submit');
      if(pb2)await submitPh(pb2.dataset.qid,parseInt(pb2.dataset.pts));
      return;
    }

    // photo cancel
    if(t.id==='ph-cancel'||t.closest('#ph-cancel')){
      var po=document.getElementById('photo-ov');if(po)po.remove();return;
    }

    // file change handled separately
  });

  document.addEventListener('change',function(e){
    if(e.target.id==='ph-file')previewPh();
    if(e.target.dataset.bonusInput)recalc();
  });
}

// ── INIT ──
async function init(){
  var now=new Date();
  document.getElementById('hdate').textContent=DAYS[now.getDay()]+', '+now.getDate()+' '+MON[now.getMonth()]+' 2026';
  setupPin();
  setupEvents();
  CHILDREN.forEach(function(c){subscribeChild(c.id);});
  subscribePending();
  subscribeDigest();
  await loadApiKey();
  renderStrip();
  renderContent();
  setInterval(function(){
    var newDay=Math.floor(Date.now()/86400000);
    if(newDay!==lastDay){
      lastDay=newDay;
      digestCache={j:null,m:null,s:null};
      var now=new Date();
      document.getElementById('hdate').textContent=DAYS[now.getDay()]+', '+now.getDate()+' '+MON[now.getMonth()]+' 2026';
      renderContent();
    }
  },60000);
}
init();
</script>
